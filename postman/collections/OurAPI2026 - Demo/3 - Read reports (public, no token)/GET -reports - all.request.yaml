$kind: http-request
name: GET /reports - all
description: "Public: no token, both reports come back."
url: "{{base_url}}/reports"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 1000
