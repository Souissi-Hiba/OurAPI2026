$kind: http-request
name: POST /reports - missing field
description: "Expect: Missing field: type"
url: "{{base_url}}/reports"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Only a title"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 1000
