$kind: http-request
name: POST /students - no body
description: "Expect: JSON body required"
url: "{{base_url}}/students"
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
