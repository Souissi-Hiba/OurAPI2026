$kind: http-request
name: GET /students/1 - with token
url: "{{base_url}}/students/1"
method: GET
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
