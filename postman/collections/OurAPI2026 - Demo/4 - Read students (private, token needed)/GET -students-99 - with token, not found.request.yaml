$kind: http-request
name: GET /students/99 - with token, not found
url: "{{base_url}}/students/99"
method: GET
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
