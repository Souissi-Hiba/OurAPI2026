$kind: http-request
name: POST /login - wrong password
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "admin",
      "password": "wrong"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
