$kind: http-request
name: GET /students - no token
description: "No badge: stopped at the door."
url: "{{base_url}}/students"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
