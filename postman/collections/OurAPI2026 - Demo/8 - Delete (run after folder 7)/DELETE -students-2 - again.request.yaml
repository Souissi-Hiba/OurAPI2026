$kind: http-request
name: DELETE /students/2 - again
description: Already deleted.
url: "{{base_url}}/students/2"
method: DELETE
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
