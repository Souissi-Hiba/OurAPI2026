$kind: http-request
name: DELETE /students/2
description: No report left, so the delete works. Run SELECT * FROM students after it.
url: "{{base_url}}/students/2"
method: DELETE
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
