$kind: http-request
name: DELETE /students/2 - still has a report
description: Student 2 wrote report 3, so MySQL must not lose that link.
url: "{{base_url}}/students/2"
method: DELETE
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 2000
