$kind: http-request
name: GET /students - expired token
description: "Only after 5 minutes have passed since login. Expect: Token expired"
url: "{{base_url}}/students"
method: GET
headers:
  Authorization: Bearer {{token}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
