$kind: http-request
name: PUT /students/99 - not found
url: "{{base_url}}/students/99"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "first_name": "Hiba",
      "last_name": "Souissi",
      "level": "4",
      "double_major": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
