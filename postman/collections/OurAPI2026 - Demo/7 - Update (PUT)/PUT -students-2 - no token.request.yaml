$kind: http-request
name: PUT /students/2 - no token
description: "Private: no badge."
url: "{{base_url}}/students/2"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "first_name": "Hiba",
      "last_name": "Souissi",
      "level": "4",
      "double_major": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 4000
