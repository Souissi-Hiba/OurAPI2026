url: "{{base_url}}/reports/3"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated title",
      "type": "research",
      "keyword_1": "ai",
      "keyword_2": "data",
      "keyword_3": "models",
      "release_date": "2026-10-19",
